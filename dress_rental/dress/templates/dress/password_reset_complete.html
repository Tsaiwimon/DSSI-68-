<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตั้งรหัสผ่านสำเร็จ</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .bg-custom-gradient {
      background: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), 
                  linear-gradient(to bottom, #FFE88D 0%, #7AAAC0 36%, #93DBFC 61%, #E5A6D3 90%, #527281 100%);
    }
  </style>
</head>
<body class="bg-custom-gradient min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">
    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
      <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-800">ตั้งรหัสผ่านสำเร็จ</h1>
    <p class="text-sm text-gray-600 mt-3">
      รหัสผ่านของคุณได้รับการเปลี่ยนเรียบร้อยแล้ว <br>
      คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที
    </p>

    <a href="/login/"
       class="inline-block mt-8 w-full py-3 rounded-lg bg-black text-white font-semibold hover:bg-gray-900 transition shadow-md">
      ไปหน้าเข้าสู่ระบบ
    </a>
  </div>

</body>
</html>
