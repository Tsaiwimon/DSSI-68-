{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Glam & Borrow{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; color: #4b5563; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50">
    <header class="bg-gradient-to-r from-pink-100 via-yellow-50 to-blue-100 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/60 p-2 rounded-full backdrop-blur-sm">
                    <i class="fa-solid fa-stars text-pink-300"></i>
                </div>
                <span class="text-xl font-bold text-gray-600 tracking-tight">Glam & Borrow</span>
            </div>
            <div class="text-right">
                <div class="text-sm font-semibold text-gray-600">{{ store.name|default:"SasiShop" }}</div>
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
